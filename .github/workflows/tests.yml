name: Tests

# Runs the "robot checker" on every push and pull request, on every branch.
# Free on GitHub's standard plan (public repos: unlimited; private repos:
# 2,000 minutes/month included) -- this suite finishes in well under a
# minute, so it costs nothing extra to run on every push.
on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (money-math unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npx tsc -b --force
        working-directory: app

  backend:
    name: Backend / OCR pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest pipeline/tests/ -v
